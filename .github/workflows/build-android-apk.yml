name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v1.0.0']
    branches: [main, android-app, android-vulkan]
    paths:
      - 'android-app/**'
      - 'patches/**'
      - 'scripts/apply-patches.sh'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.1.10909125"
      GRADLE_VERSION: "8.10"
      VULKAN_SDK_VERSION: "1.4.363.0"
      VULKAN_SDK_SHA256: "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
           packages: ''

      - name: Install SDK components (platform, build-tools, NDK, CMake)
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - name: Install modern host Vulkan SDK (glslc + SPIRV-Headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils build-essential spirv-headers
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          curl -fL "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
            -o "$RUNNER_TEMP/vulkan-sdk/vulkan_sdk.tar.xz"
          echo "${VULKAN_SDK_SHA256}  $RUNNER_TEMP/vulkan-sdk/vulkan_sdk.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/vulkan-sdk/vulkan_sdk.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "VULKAN_INCLUDE_DIR=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/include" >> "$GITHUB_ENV"
          echo "VULKAN_GLSLC_EXECUTABLE=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin/glslc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64:$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/lib/VulkanLoader" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin/glslc" --version

      - name: Apply llama.cpp patches (LittleBit Q1_0 + KleidiAI)
        run: bash scripts/apply-patches.sh

      - name: Install Gradle
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Prepare optional release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            umask 077
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/distribution.jks"
            echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/distribution.jks" >> "$GITHUB_ENV"
          fi

      - name: Build optimized release APK
        working-directory: android-app
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LittleBit-Chat-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/LittleBit-Chat-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/LittleBit-Chat-arm64.apk
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/tags/v1.0.0'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
      - name: Attach signed APK
        uses: softprops/action-gh-release@v3
        with:
          files: LittleBit-Chat-arm64.apk
          fail_on_unmatched_files: true
