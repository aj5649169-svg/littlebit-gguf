name: Android arm64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja if needed
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
      - name: Build Android arm64 binaries
        run: bash scripts/build-android.sh
      - name: Verify packaged binaries
        run: |
          dist=dist/littlebit-gguf-android-arm64

          for name in llama-completion llama-bench; do
            if [[ ! -x "$dist/bin/$name" ]]; then
              echo "Missing executable binary: $dist/bin/$name" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' binary; do
            description="$(file -b "$binary")"
            printf '%s: %s\n' "$binary" "$description"
            [[ "$description" == *"ELF 64-bit"* \
              && "$description" == *"ARM aarch64"* \
              && "$description" == *"executable"* ]]
          done < <(find "$dist/bin" -maxdepth 1 -type f -executable -print0)

          libs=()
          while IFS= read -r -d '' library; do
            libs+=("$library")
          done < <(find -L "$dist/lib" -maxdepth 1 -name '*.so*' -type f -print0)
          if [[ ${#libs[@]} -eq 0 ]]; then
            echo "No shared libraries found in $dist/lib" >&2
            exit 1
          fi
          for library in "${libs[@]}"; do
            description="$(file -b "$library")"
            printf '%s: %s\n' "$library" "$description"
            [[ "$description" == *"ELF 64-bit"* \
              && "$description" == *"ARM aarch64"* \
              && "$description" == *"shared object"* ]]
          done

          if [[ ! -x "$dist/run-android.sh" ]]; then
            echo "Missing executable wrapper: $dist/run-android.sh" >&2
            exit 1
          fi
          grep -Fq 'bin/llama-completion' "$dist/run-android.sh"
          grep -Fq -- '-t 4' "$dist/run-android.sh"

          if [[ ! -x "$dist/bench-android.sh" ]]; then
            echo "Missing executable benchmark script: $dist/bench-android.sh" >&2
            exit 1
          fi
          sh -n "$dist/bench-android.sh"
          grep -Fq 'bin/llama-bench' "$dist/bench-android.sh"

          ls -lR "$dist"
      - uses: actions/upload-artifact@v4
        with:
          name: littlebit-gguf-android-arm64
          path: dist/littlebit-gguf-android-arm64.tar.gz
          if-no-files-found: error
          
